name: Test

on:
  pull_request:
  merge_group:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    strategy:
      matrix:
        rust:
          - 1.85.0
          - stable
          - beta
        experimental:
          - false
        include:
          - rust: nightly
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust toolchain
        shell: bash
        run: |
          if [[ "${{ matrix.rust }}" == "stable" ]]; then
            rustup component add rustfmt clippy
          else
            args=(--component rustfmt --component clippy)
            if [[ "${{ matrix.rust }}" == "nightly" ]]; then
              args+=(--allow-downgrade)
            fi
            rustup toolchain install "${{ matrix.rust }}" "${args[@]}"
            rustup override set "${{ matrix.rust }}"
          fi
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: cargo-nextest
      - name: Format
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # TODO: Use something like cargo-hack for more robust feature configuration testing.
      - name: Clippy / all-features
        run: cargo clippy --workspace --all-targets --features persistence -- -D warnings
      - name: Test
        run: cargo nextest run --workspace --tests --examples --features persistence --no-fail-fast
      - name: Test Manual Registration / no-default-features
        run: cargo nextest run --workspace --tests --no-fail-fast --no-default-features --features macros
      - name: Test docs
        run: cargo test --workspace --doc

  miri_shards:
    name: Miri (${{ matrix.partition }})
    strategy:
      fail-fast: false
      matrix:
        partition:
          - slice:1/4
          - slice:2/4
          - slice:3/4
          - slice:4/4
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Miri
        uses: dtolnay/rust-toolchain@miri
        id: rust-toolchain
      - name: Select Miri toolchain
        run: rustup override set "${{ steps.rust-toolchain.outputs.name }}"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Matrix shards share a cache key, so only one can reserve it for saving.
          save-if: ${{ github.ref == 'refs/heads/master' && matrix.partition == 'slice:1/4' }}
      - uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: cargo-nextest
      - name: Setup Miri
        run: cargo miri setup
      - name: Test with Miri
        run: cargo miri nextest run --no-fail-fast --tests --partition ${{ matrix.partition }}
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
      - name: Run examples with Miri
        if: matrix.partition == 'slice:1/4'
        run: cargo miri run --example calc

  miri:
    name: Miri
    if: always()
    needs: miri_shards
    runs-on: ubuntu-latest
    steps:
      - name: Check Miri shards
        run: test "${{ needs.miri_shards.result }}" = success

  shuttle:
    name: Shuttle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: cargo-nextest
      - name: Test with Shuttle
        run: cargo nextest run --features shuttle --test parallel

  benchmarks:
    # https://github.com/CodSpeedHQ/action/issues/126
    if: github.repository == 'salsa-rs/salsa' && github.event_name != 'merge_group'
    name: Benchmarks
    runs-on: codspeed-macro
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: "Setup codspeed"
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: cargo-codspeed

      - name: "Build benchmarks"
        run: |
          cargo codspeed build -m simulation -m memory \
            --bench creation \
            --bench field_access \
            --bench query_fetch \
            --bench accumulator \
            --bench dataflow \
            --bench eviction
          cargo codspeed build -m walltime --bench eviction_walltime

      - name: "Run benchmarks"
        uses: CodSpeedHQ/action@0ca9cbbf4623b599a6c3ed4fc8a922942705d9f1 # v5.0.2
        with:
          mode: "simulation,memory,walltime"
          run: cargo codspeed run
          token: ${{ secrets.CODSPEED_TOKEN }}
